<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>diusoki – Mua sắm mỗi ngày</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4e8df"><meta name="description" content="diusoki — mua sắm, bán hàng và kết nối cửa hàng"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#2d2a28;--mut:#8a8580;--line:#ece6df;--acc:#4a4540;--soft:#f1ece6;--blue:#dbe7f2;--sand:#efe6dc;--red:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b1a;--card:#292623;--ink:#f1ece6;--mut:#a39d96;--line:#3a3632;--acc:#e8dfd5;--soft:#322e2a;--blue:#2c3844;--sand:#3a332c}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 'Be Vietnam Pro',system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#app{max-width:720px;margin:auto}button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;margin:4px 0 10px}
.hero{background:linear-gradient(#dfe8f1,#f3efe9);text-align:center;padding:14px 16px 18px;position:relative}
.logo{font:800 44px 'Baloo 2';letter-spacing:-1px;color:#2d2a28;line-height:1}.hand{font-family:Caveat,cursive;color:#6d6762;font-size:15px}
.hnav{display:flex;justify-content:center;gap:16px;margin:6px 0 10px;color:#2d2a28}
.hbtns{position:absolute;right:12px;top:12px;display:flex;gap:6px}.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;color:#2d2a28}
.badge{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
.search{display:flex;align-items:center;background:#fff;border:1px solid #d8d2ca;border-radius:30px;padding:2px 14px;gap:8px;color:#8a8580}.search input{border:0;margin:0;background:none;color:#2d2a28;padding:10px 0}
.trust{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:18px;margin:14px 12px;padding:10px 4px;text-align:center;font-size:12px}.trust b{display:block;font-size:18px;font-weight:400}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:4px 12px}@media(min-width:560px){.cats{grid-template-columns:repeat(6,1fr)}}
.cat{text-align:center;font-size:12.5px}.cat i{display:grid;place-items:center;font-style:normal;font-size:30px;height:66px;border-radius:22px;margin-bottom:5px}
.banner{margin:16px 12px;border-radius:20px;padding:26px 20px;background:linear-gradient(120deg,#e4d9cb,#f3ece3);min-height:150px;color:#2d2a28;position:relative;overflow:hidden}
.banner h2{font:500 26px/1.2 Caveat;margin:6px 0;max-width:62%}.banner .tag{position:absolute;right:16px;top:22px;display:grid;gap:8px;font:500 17px Caveat;transform:rotate(-4deg)}.banner .tag span{background:#fffc;padding:3px 12px;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px}.promo{border-radius:18px;padding:16px;min-height:150px;position:relative}.promo h3{font:700 20px/1.15 'Baloo 2';margin:0 0 4px}.promo p{margin:0 0 10px;color:var(--mut);font-size:12px}.promo em{position:absolute;right:10px;bottom:46px;font-size:46px;font-style:normal}
.pill{background:var(--acc);color:var(--bg);border-radius:20px;padding:7px 14px;font-size:12.5px;display:inline-block}
.sec{display:flex;justify-content:space-between;align-items:center;padding:20px 14px 8px}.sec h3{margin:0;font:700 19px 'Baloo 2'}.sec a{color:var(--mut);cursor:pointer;font-size:13px}
.feat{display:flex;gap:10px;overflow-x:auto;padding:0 12px 4px}.feat div{flex:0 0 108px;text-align:center;font-size:12px}.feat i{display:grid;place-items:center;font-style:normal;font-size:38px;height:84px;border-radius:14px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;cursor:pointer}.pc img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--soft)}.pc .in{padding:8px 10px 10px}.pc .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}.pr{color:var(--red);font-weight:600}
.hb{position:absolute;right:6px;top:6px;background:#fffc;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;color:#2d2a28}
.empty{text-align:center;padding:36px 20px;color:var(--mut);background:var(--card);margin:0 12px;border:1px dashed var(--line);border-radius:18px}.empty b{font-size:34px;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav div{display:flex;width:100%;max-width:720px}.nav button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--mut);display:grid;justify-items:center;gap:2px}.nav .on{color:var(--ink);font-weight:600}
.pg{padding:12px}.pg h2{font:700 22px 'Baloo 2';margin:6px 0 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.btn{background:var(--acc);color:var(--bg);border-radius:24px;padding:11px 20px;font-weight:600;display:inline-block;text-align:center}.btn.w{width:100%}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:6px 14px;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}.row>.g{flex:1;min-width:0}.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px}.chip{flex:0 0 auto;background:var(--soft);border-radius:20px;padding:6px 14px}.chip.on{background:var(--acc);color:var(--bg)}
.thumb{width:68px;height:68px;border-radius:12px;object-fit:cover;background:var(--soft)}.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:18px}.qty button{width:30px;height:30px}.qty span{min-width:26px;text-align:center}
.ov{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}.md{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.tabs{display:flex;background:var(--soft);border-radius:20px;padding:3px;margin-bottom:12px}.tabs button{flex:1;padding:8px;border-radius:18px}.tabs .on{background:var(--card);font-weight:600}
.gb{width:100%;border:1px solid var(--line);background:var(--card);border-radius:24px;padding:11px;font-weight:500;margin-bottom:10px}.or{text-align:center;color:var(--mut);margin:8px 0;font-size:12px}
.st{font-size:11.5px;padding:2px 10px;border-radius:10px;background:var(--sand)}#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2d2a28;color:#fff;padding:10px 18px;border-radius:22px;z-index:99;max-width:90%;text-align:center}.mut{color:var(--mut)}

function reorder(id){const o=S.orders.find(x=>x.id===id);o.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(!p||p.stock<1)return;const c=S.cart.find(x=>x.id===i.pid);if(c)c.q=Math.min(p.stock,c.q+i.qty);else S.cart.push({id:i.pid,q:Math.min(p.stock,i.qty)})});save();toast('Đã thêm vào giỏ hàng');go('cart')}

PG.myrt=()=>me()?PK(HD('Yêu cầu hoàn hàng')+(S.rt.filter(r=>r.buyer===S.me).sort((a,b)=>b.t-a.t).map(r=>rtCard(r)).join('')||EM('↩️','Bạn chưa có yêu cầu hoàn hàng.<br>Vào Đơn mua → chọn đơn đang giao/đã giao để yêu cầu.'))):accv();

/* ---- Ví của tôi ---- */
const _pWal=PG.wal;
PG.wal=()=>{if(!me())return accv();const U=S.me,tx=S.wtx.filter(x=>x.uid===U).sort((a,b)=>b.t-a.t).slice(0,30),tp=S.topups.filter(x=>x.uid===U).sort((a,b)=>b.t-a.t).slice(0,8),wd=S.wd.filter(x=>x.uid===U).sort((a,b)=>b.t-a.t).slice(0,8);
 const old=_pWal().replace('class="pk pkbg"','class="pkbg"').replace("toast('Rút tiền cần liên kết ngân hàng – sắp ra mắt')","wdForm()");
 return PK(HD('Ví của tôi','💳')+`<div class="c" style="text-align:center"><div class="sub">Số dư ví</div><div style="font-size:32px;font-weight:700;color:#f0386b">${money(S.wallet)}</div><a class="pbtn" style="margin-top:10px" onclick="topupForm()">+ Nạp tiền</a></div>`
 +(tp.length?`<div class="c"><b>Yêu cầu nạp tiền</b>${tp.map(x=>`<div class="lr" style="cursor:default"><span class="g">${money(x.amount)}<div class="sub">${dt(x.t)}</div></span><span class="chip2" style="margin:0">${['Chờ duyệt','Đã cộng','Từ chối'][x.status]}</span></div>`).join('')}</div>`:'')
 +(wd.length?`<div class="c"><b>Yêu cầu rút tiền</b>${wd.map(x=>`<div class="lr" style="cursor:default"><span class="g">${money(x.amount)}<div class="sub">${dt(x.t)}</div></span><span class="chip2" style="margin:0">${['Chờ duyệt','Đã chuyển khoản','Từ chối'][x.status]}</span></div>`).join('')}</div>`:'')
 +`<div class="c"><b>Lịch sử giao dịch</b>${tx.map(x=>`<div class="lr" style="cursor:default"><span class="g">${esc(x.note||x.type)}<div class="sub">${dt(x.t)}</div></span><b style="color:${x.amount>0?'#1a9d63':'#d9304f'}">${x.amount>0?'+':''}${money(x.amount)}</b></div>`).join('')||'<div class="sub" style="padding:10px 0">Chưa có giao dịch</div>'}</div>`+old)};
function topupForm(){const b=(S.cfg||{}).bank||{};mdl('Nạp tiền vào ví',`<div class="hint">${b.acc?`Chuyển khoản tới:<br><b>${esc(b.name||'')}</b> · STK <b>${esc(b.acc)}</b><br>Chủ TK: ${esc(b.owner||'')}<br>Nội dung: <b>NAP ${esc((me().email||'').split('@')[0])}</b>`:'Chủ web chưa cập nhật số tài khoản, hãy liên hệ để được hướng dẫn.'}</div><label>Số tiền (₫)</label><input id="tu" type="number" inputmode="numeric" placeholder="VD: 100000"><label>Ghi chú / mã giao dịch</label><input id="tn" placeholder="Nội dung chuyển khoản, mã GD...">`,'Gửi yêu cầu nạp',()=>{const a=+mv('tu');if(!(a>=10000))return toast('Tối thiểu 10.000₫');cl('topReq',a,mv('tn'))})}
function wdForm(){const U=S.me,av=Math.max(0,revenue()-S.wd.filter(w=>w.uid===U&&w.status!==2).reduce((a,w)=>a+w.amount,0)),def=dskDefaultBank(),sel=def?.bank||'VCB';mdl('Rút doanh thu',`<div class="hint">Có thể rút: <b>${money(av)}</b></div><label>Số tiền (₫)</label><input id="wa" type="number" inputmode="numeric" placeholder="Tối thiểu 10.000₫"><label>Chọn ngân hàng nhận tiền</label>${dskBankPicker('wd',sel,true)}<div id="wd-bank-fields" style="display:${sel==='PAYPAL'?'none':'block'}"><label>Số tài khoản</label><input id="wd-acc" inputmode="numeric" placeholder="Nhập số tài khoản"><label>Chủ tài khoản</label><input id="wd-owner" placeholder="Họ tên chủ tài khoản"></div><div id="wd-paypal-fields" style="display:${sel==='PAYPAL'?'block':'none'}"><label>Email PayPal</label><input id="wd-paypal-email" type="email" placeholder="Email tài khoản PayPal"></div><label class="pay-choice"><input id="wd-default" type="checkbox" ${def?.bank?'checked':''}><span>Lưu làm phương thức nhận tiền mặc định lần sau</span></label><p class="pay-note">Chọn phương thức nhận tiền chỉ lưu thông tin cho yêu cầu rút. Chuyển tiền thực tế vẫn cần chủ web xử lý; PayPal chưa được kết nối cổng chi trả tự động.</p>`,'Gửi yêu cầu rút',()=>{const a=+mv('wa'),choice=mv('wd-bankChoice')||'VCB';if(!(a>=10000))return toast('Số tiền rút tối thiểu là 10.000₫');if(a>av)return toast('Vượt quá doanh thu có thể rút');let info='';if(choice==='PAYPAL'){const email=mv('wd-paypal-email').trim();if(!/^\S+@\S+\.\S+$/.test(email))return toast('Nhập email PayPal hợp lệ');info='PayPal · '+email}else{const b=DSK_BANKS.find(x=>x.id===choice);const acc=mv('wd-acc').trim(),owner=mv('wd-owner').trim();if(acc.length<5||owner.length<2)return toast('Nhập số tài khoản và chủ tài khoản');info=(b?.name||choice)+' · '+acc+' · '+owner}if($('#wd-default')?.checked)localStorage.setItem('dskBankDefault',JSON.stringify({bank:choice}));cl('wdReq',a,info)})}

/* ---- Gửi hàng / hoàn hàng (người dùng) ---- */
function srAsk(oid){mdl('Yêu cầu gửi hàng',`<div class="sub">Đơn #${oid} – gửi cho chủ web duyệt và gán đơn vị vận chuyển.</div><label>Ghi chú (số kiện, giờ lấy hàng...)</label><textarea id="sn" rows="2"></textarea>`,'Gửi yêu cầu',()=>cl('srReq',oid,mv('sn')))}
function rtAsk(oid){mdl('Yêu cầu hoàn hàng',`<div class="sub">Đơn #${oid}. Chủ web sẽ xem xét và cho phép/không cho phép gửi hàng về.</div><label>Lý do</label><select id="rr">${opt(['Hàng lỗi / hư hỏng','Sai mẫu / sai mô tả','Thiếu hàng','Không đúng kích cỡ','Không nhận được hàng','Đổi ý','Khác'])}</select><label>Mô tả chi tiết</label><textarea id="rn" rows="3"></textarea>`,'Gửi yêu cầu',()=>{if(mv('rn').length<5)return toast('Hãy mô tả chi tiết lý do');cl('rtReq',oid,mv('rr'),mv('rn'))})}
function rtShip(id){mdl('Gửi hàng hoàn về',`<label>Đơn vị vận chuyển</label><select id="hc">${opt(CARR())}</select><label>Mã vận đơn</label><input id="hk">`,'Xác nhận đã gửi',()=>{if(!mv('hk'))return toast('Nhập mã vận đơn');cl('rtSent',id,mv('hc'),mv('hk'))})}
const rtCard=(r,adm)=>`<div class="c"><div class="row"><b class="g">↩️ #${esc(r.oid)}</b><span class="chip2" style="margin:0">${RTS[r.status]}</span></div><div class="sub">${esc(r.name)} · ${esc(r.phone)} · ${dt(r.t)}</div>${r.items.map(i=>`<div>• ${esc(i.name)} ×${i.qty}</div>`).join('')}<div style="margin-top:6px"><b>Lý do:</b> ${esc(r.reason)}${r.note?' — '+esc(r.note):''}</div>${r.adminNote?`<div class="hint" style="margin-top:6px">💬 Chủ web: ${esc(r.adminNote)}${r.addr?`<br>📍 Gửi về: ${esc(r.addr)}`:''}</div>`:''}${r.rCode?`<div class="sub" style="margin-top:6px">🚚 Khách gửi về: ${esc(r.rCarrier)} · ${esc(r.rCode)}</div>`:''}${r.status===4?`<div class="sub">Đã hoàn ${money(r.refund||0)} vào ví khách</div>`:''}<div class="row" style="margin-top:10px;flex-wrap:wrap">${adm&&r.status===0?`<a class="pbtn" onclick="rtDec('${r.id}',1)">✅ Cho phép gửi về</a><a class="chip2" onclick="rtDec('${r.id}',0)">⛔ Từ chối</a>`:''}${adm&&r.status===3?`<a class="pbtn" onclick="rtRecv('${r.id}')">📥 Đã nhận hàng – hoàn tiền</a>`:''}${!adm&&r.status===1?`<a class="pbtn" onclick="rtShip('${r.id}')">📦 Tôi đã gửi hàng về</a>`:''}</div></div>`;

/* ---- Quản trị chủ web ---- */
function pAdm(){if(!isAdmin())return PK(HD('Quản trị','🔒')+EM('🔒','Bạn không có quyền truy cập.'));
 const n=(a,f)=>a.filter(f).length,B={tp:n(S.topups,x=>x.status===0),sr:n(S.sr,x=>x.status===0),rt:n(S.rt,x=>x.status===0||x.status===3),wd:n(S.wd,x=>x.status===0)},
 tabs=[['ov','Tổng quan'],['us','Người dùng'],['tp','Nạp tiền'],['sr','Yêu cầu gửi hàng'],['od','Đơn hàng'],['rt','Hoàn hàng'],['wd','Rút tiền'],['pr','Sản phẩm'],['cf','Cài đặt']],T={ov:aOv,us:aUs,tp:aTp,sr:aSr,od:aOd,rt:aRt,wd:aWd,pr:aPr,cf:aCf}[AT]();
 return PK(HD('Quản trị chủ web','🛡️')+`<div class="tabs2" style="padding:0 16px">${tabs.map(t=>`<a class="${AT===t[0]?'on':''}" onclick="AT='${t[0]}';AQ='';R()">${t[1]}${B[t[0]]?` <span class="nb" style="position:static;display:inline-block">${B[t[0]]}</span>`:''}</a>`).join('')}</div>`+T)}
PG.adm=pAdm;
const SB=()=>`<div class="c"><input id="aq" placeholder="🔍 Tìm kiếm" value="${esc(AQ)}" oninput="AQ=this.value;R();var e=$('#aq');e.focus();e.setSelectionRange(99,99)" style="margin:0"></div>`;
function aOv(){const o=S.allOrders,dn=o.filter(x=>x.status===2),k=(a,b)=>`<div><b>${a}</b><span>${b}</span></div>`,n=(a,f)=>a.filter(f).length;
 return `<div class="c stat">${k(S.allUsers.length,'Người dùng')}${k(o.length,'Đơn hàng')}${k(S.products.length,'Sản phẩm')}${k(dn.length,'Đã giao')}</div><div class="c stat">${k(dm(dn.reduce((a,x)=>a+x.total,0)),'Doanh số')}${k(dm(Object.values(S.wallets).reduce((a,b)=>a+b,0)),'Tổng ví')}${k(n(S.topups,x=>x.status===0),'Chờ nạp')}${k(n(S.rt,x=>x.status===0),'Chờ hoàn')}</div><div class="c"><b>Việc cần xử lý</b>${LR('💰',`Nạp tiền chờ duyệt (${n(S.topups,x=>x.status===0)})`,"AT='tp';R()")}${LR('📮',`Yêu cầu gửi hàng (${n(S.sr,x=>x.status===0)})`,"AT='sr';R()")}${LR('↩️',`Hoàn hàng cần xử lý (${n(S.rt,x=>x.status===0||x.status===3)})`,"AT='rt';R()")}${LR('🏦',`Rút tiền chờ duyệt (${n(S.wd,x=>x.status===0)})`,"AT='wd';R()")}</div>`}
function aUs(){const q=AQ.toLowerCase(),a=S.allUsers.filter(u=>!q||((u.name||'')+(u.email||'')+(u.phone||'')+u.id).toLowerCase().includes(q)).sort((x,y)=>(y.t||0)-(x.t||0));
 return SB()+(a.map(u=>`<div class="c"><div class="row"><div class="g"><b>${esc(u.name||'—')}</b>${ADMIN_EMAILS.includes((u.email||'').toLowerCase())?' 🛡️':''}<div class="sub">${esc(u.email||'')} · ${esc(u.phone||'')}</div></div><div style="text-align:right"><b style="color:#f0386b">${money(S.wallets[u.id]||0)}</b><br><a class="chip2" onclick="balF('${u.id}')">± Số dư</a></div></div></div>`).join('')||EM('👥','Không có người dùng'))}
function balF(uid){const u=S.allUsers.find(x=>x.id===uid)||{};mdl('Điều chỉnh số dư',`<div class="sub">${esc(u.name||'')} · ${esc(u.email||'')}<br>Số dư hiện tại: <b>${money(S.wallets[uid]||0)}</b></div><label>Thao tác</label><select id="bt"><option value="1">➕ Cộng tiền</option><option value="-1">➖ Trừ tiền</option></select><label>Số tiền (₫)</label><input id="ba" type="number" inputmode="numeric"><label>Ghi chú</label><input id="bn" placeholder="Lý do (nạp tiền, thưởng...)">`,'Xác nhận',()=>{const a=+mv('ba');if(!(a>0))return toast('Nhập số tiền hợp lệ');cl('admBal',uid,a*+mv('bt'),mv('bn'))})}
function aTp(){return [...S.topups].sort((x,y)=>y.t-x.t).map(x=>`<div class="c"><div class="row"><b class="g">${esc(x.name||x.email)}</b><b style="color:#f0386b">${money(x.amount)}</b></div><div class="sub">${esc(x.email||'')} · ${dt(x.t)}</div>${x.note?`<div>📝 ${esc(x.note)}</div>`:''}<div class="row" style="margin-top:8px"><span class="chip2" style="margin:0">${['Chờ duyệt','Đã cộng tiền','Từ chối'][x.status]}</span><span class="g"></span>${x.status===0?`<a class="pbtn" onclick="cl('tpDo','${x.id}',1)">Duyệt & cộng</a><a class="chip2" onclick="cl('tpDo','${x.id}',0)">Từ chối</a>`:''}</div></div>`).join('')||EM('💰','Chưa có yêu cầu nạp tiền')}
function aSr(){return [...S.sr].sort((x,y)=>y.t-x.t).map(x=>{const o=S.allOrders.find(y=>y.id===x.oid)||{items:[]};return `<div class="c"><div class="row"><b class="g">📮 #${esc(x.oid)}</b><span class="chip2" style="margin:0">${SRS[x.status]}</span></div><div class="sub">Shop: ${esc(x.sellerName||'')} · ${dt(x.t)}</div>${o.items.map(i=>`<div>• ${esc(i.name)} ×${i.qty}</div>`).join('')}<div class="sub" style="margin-top:4px">📍 Giao về: ${esc(o.name||'')} · ${esc(o.phone||'')} · ${esc(o.addr||'')}</div>${x.note?`<div>📝 ${esc(x.note)}</div>`:''}${x.carrier?`<div class="hint" style="margin-top:6px">🚚 ${esc(x.carrier)} · ${esc(x.code)}</div>`:''}${x.status===0?`<div class="row" style="margin-top:8px"><a class="pbtn" onclick="srF('${x.id}',1)">Duyệt & gán vận đơn</a><a class="chip2" onclick="srF('${x.id}',0)">Từ chối</a></div>`:''}</div>`}).join('')||EM('📮','Chưa có yêu cầu gửi hàng')}
function srF(id,ok){ok?mdl('Duyệt gửi hàng',`<label>Đơn vị giao hàng</label><select id="hc">${opt(CARR())}</select><label>Mã vận đơn</label><input id="hk" value="${gen()}"><label>Ghi chú cho shop</label><input id="hn">`,'Duyệt',()=>cl('srOk',id,mv('hc'),mv('hk'),mv('hn'))):mdl('Từ chối yêu cầu',`<label>Lý do</label><input id="hn">`,'Từ chối',()=>cl('srNo',id,mv('hn')))}
function shipF(oid){mdl('Gán đơn vị giao hàng',`<label>Đơn vị giao hàng</label><select id="hc">${opt(CARR())}</select><label>Mã vận đơn</label><input id="hk" value="${gen()}">`,'Lưu & chuyển "Đang giao"',()=>{if(!mv('hk'))return toast('Nhập mã vận đơn');cl('admShip',oid,mv('hc'),mv('hk'))})}
function aOd(){const q=AQ.toLowerCase();return SB()+([...S.allOrders].sort((x,y)=>y.t-x.t).filter(o=>!q||(o.id+o.name+o.phone).toLowerCase().includes(q)).map(o=>`<div class="c"><div class="row"><b class="g">#${esc(o.id)}</b><span class="st">${ST[o.status]}</span></div><div class="sub">${dt(o.t)} · ${esc(o.pay||'')}${o.paid?' ✅':''}</div>${o.items.map(i=>`<div>• ${esc(i.name)} ×${i.qty}</div>`).join('')}<div class="sub" style="margin-top:4px">📍 ${esc(o.name)} · ${esc(o.phone)} · ${esc(o.addr)}</div>${o.ship?`<div class="hint" style="margin-top:6px">🚚 ${esc(o.ship.carrier)} · ${esc(o.ship.code)}</div>`:''}<div class="row" style="margin-top:8px;flex-wrap:wrap"><b style="color:#f0386b" class="g">${money(o.total)}</b>${o.status<2?`<a class="chip2" onclick="shipF('${o.id}')">🚚 Vận đơn</a><a class="chip2" onclick="cl('admOst','${o.id}',2)">✅ Giao xong</a><a class="chip2" onclick="if(confirm('Hủy đơn này?'))cl('admOst','${o.id}',3)">✖ Hủy</a>`:''}</div></div>`).join('')||EM('📄','Chưa có đơn hàng'))}
function aRt(){const rf=S.allOrders.filter(o=>o.status===3&&o.paid&&!o.refunded);return (rf.length?`<div class="c"><b>💳 Đơn hủy đã trả bằng ví – chờ hoàn tiền</b>${rf.map(o=>`<div class="row" style="margin-top:8px"><span class="g">#${esc(o.id)} · ${esc(o.name)}</span><a class="pbtn" onclick="cl('admRefund','${o.id}')">Hoàn ${money(o.total)}</a></div>`).join('')}</div>`:'')+([...S.rt].sort((x,y)=>y.t-x.t).map(r=>rtCard(r,1)).join('')||EM('↩️','Chưa có yêu cầu hoàn hàng'))}
function rtDec(id,ok){const c=S.cfg||{};ok?mdl('Cho phép khách gửi hàng về',`<label>Địa chỉ nhận hàng hoàn</label><textarea id="ra" rows="2">${esc(c.returnAddr||'')}</textarea><label>Lời nhắn cho khách</label><input id="rm" placeholder="VD: Đóng gói cẩn thận, giữ nguyên tem">`,'Cho phép',()=>{if(!mv('ra'))return toast('Nhập địa chỉ nhận hàng hoàn');cl('rtDecide',id,1,mv('rm'),mv('ra'))}):mdl('Từ chối hoàn hàng',`<label>Lý do từ chối</label><input id="rm">`,'Từ chối',()=>cl('rtDecide',id,0,mv('rm'),''))}
function rtRecv(id){const r=S.rt.find(x=>x.id===id),o=S.allOrders.find(x=>x.id===r.oid)||{};mdl('Xác nhận đã nhận hàng hoàn',`<div class="sub">Đơn #${esc(r.oid)} · thanh toán: ${esc(o.pay||'')}</div><label>Số tiền hoàn vào ví khách (₫) – nhập 0 nếu không hoàn</label><input id="rf" type="number" inputmode="numeric" value="${r.total||0}"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rs" checked style="width:20px;margin:0">Cộng lại hàng vào kho</label>`,'Xác nhận',()=>cl('rtDone',id,Math.max(0,+mv('rf')),$('#rs').checked))}

const _chatTerms=['khiêu dâm','đồi trụy','porn','pornography','xxx','ảnh nóng','video nóng','khỏa thân','khoa than','lộ hàng','lo hang','18+','sex chat'];
function _chatViolation(t){const plain=(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');const terms=_chatTerms.map(x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'));if(terms.some(x=>plain.includes(x)))return 'Nội dung 18+ hoặc đồi trụy bị cấm';if(/(?:\+?84|0)\s*(?:\d[\s().-]*){8,11}/.test(plain))return 'Không được chia sẻ số điện thoại';const n={khong:0,zero:0,khongg:0,mot:1,motj:1,hai:2,ba:3,bon:4,tu:4,nam:5,lam:5,sau:6,bay:7,tam:8,chin:9};let run=0;for(const w of plain.split(/[^a-z0-9]+/).filter(Boolean)){if(Object.prototype.hasOwnProperty.call(n,w))run++;else run=0;if(run>=8)return 'Không được viết số điện thoại bằng chữ'}if(/\b(zalo|telegram|whatsapp|inbox sdt|số điện thoại|so dien thoai)\b/.test(plain))return 'Không được chia sẻ thông tin liên hệ';return ''}
window.sendChat=async()=>{if(!FU)return toast('Hãy đăng nhập');if(window.UP?.chatBlocked)return toast('Tài khoản đã bị khóa chat do vi phạm quy định');const txt=$('#chatText')?.value.trim();if(!txt)return toast('Nhập tin nhắn');if(txt.length>1000)return toast('Tin nhắn quá dài');const bad=_chatViolation(txt);if(bad){try{await setDoc(doc(db,'users',FU.uid),{chatBlocked:true,chatBlockedAt:Date.now(),chatBlockReason:bad},{merge:true});window.UP={...(window.UP||{}),chatBlocked:true,chatBlockReason:bad}}catch{}toast(bad+'. Tài khoản bị khóa chat theo quy định.');R();return}if(/https?:\/\/|www\./i.test(txt))return toast('Chat không cho gửi liên kết ngoài');const to=V.to;if(!to||to===FU.uid)return toast('Người nhận không hợp lệ');const chatId=[FU.uid,to].sort().join('_');try{await addDoc(collection(db,'chats',chatId,'messages'),{from:FU.uid,to,text:txt,createdAt:Date.now()});$('#chatText').value='';toast('Đã gửi tin nhắn')}catch(e){toast(err(e))}};
const _chatPage=PG.chat;PG.chat=()=>{if(window.UP?.chatBlocked)return PK(HD('Chat bị khóa')+`<div class="c">Tài khoản đã bị khóa chat do vi phạm quy định. Nếu bạn cho rằng đây là nhầm lẫn, hãy liên hệ hỗ trợ.</div>`);const h=_chatPage();setTimeout(()=>{try{window._chatUnsub?.();const id=[FU.uid,V.to].sort().join('_');window._chatUnsub=onSnapshot(query(collection(db,'chats',id,'messages')),snap=>{const box=document.getElementById('chatMessages');if(!box)return;const a=snap.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));box.innerHTML=a.map(m=>`<div style="display:flex;justify-content:${m.from===FU.uid?'flex-end':'flex-start'};margin:7px 0"><div style="max-width:85%;padding:9px 12px;border-radius:14px;background:${m.from===FU.uid?'#eee4dc':'var(--soft)'}">${esc(m.text||'')}<div class="sub" style="font-size:10px">${new Date(m.createdAt||Date.now()).toLocaleString('vi-VN')}</div></div></div>`).join('')||'Chưa có tin nhắn';box.scrollTop=box.scrollHeight},e=>toast(err(e)))}catch(e){}},120);return h};
const _pubGate=window.publish;window.publish=async()=>{if((window.UP?.sellerStatus||'none')!=='approved'){toast('Bạn cần được duyệt người bán trước khi đăng sản phẩm');return go('applySeller')}return _pubGate()};
const _paddGate=window.padd;window.padd=async()=>{if((window.UP?.sellerStatus||'none')!=='approved'){toast('Bạn cần được duyệt người bán trước khi đăng sản phẩm');return go('applySeller')}return _paddGate()};

<script>
/* ===== DIUSOKI v3: hồ sơ, ảnh bìa/avatar, tin nhắn, rút tiền, tiện ích mới ===== */
(()=>{
'use strict';
const LSg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},LSs=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const UPx=()=>window.UP||{},uid=()=>window.FU&&FU.uid;

const dayL=t=>new Date(t).toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit'});
const ago=t=>{const d=Date.now()-t;return !t?'':d<6e4?'Vừa xong':d<36e5?Math.floor(d/6e4)+' phút':d<864e5?Math.floor(d/36e5)+' giờ':new Date(t).toLocaleDateString('vi-VN')};
const fold=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const av=(ph,nm,sz)=>`<span class="v3av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px">${ph?`<img src="${esc(ph)}" alt="" referrerpolicy="no-referrer">`:esc((String(nm||'?').trim()[0]||'?').toUpperCase())}</span>`;
const myPhoto=()=>UPx().photo||(window.FU&&FU.photoURL)||LSg('dsk_photo_'+uid(),'');

/* ---------- tùy chọn giao diện ---------- */
const PR=()=>LSg('dskPrefs',{dark:false,zoom:1});

window.v3Pref=(k,v)=>{const p=PR();p[k]=v;LSs('dskPrefs',p);applyPrefs();R()};

/* ---------- xử lý ảnh ---------- */
const shrink=(f,max,q)=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Không xử lý được ảnh')),'image/jpeg',q)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Ảnh không đọc được, hãy chọn JPG/PNG/WebP'))};im.src=u});
const toData=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Không đọc được ảnh'));r.readAsDataURL(b)});
async function syncProfile(){if(!uid())return;try{const p=UPx(),m=me();await setDoc(doc(db,'profiles',uid()),{uid:uid(),name:m.name,nameLower:fold(m.name),photo:myPhoto()&&myPhoto().length<200000?myPhoto():'',cover:'',bio:p.bio||'',updatedAt:Date.now()},{merge:true});window._pfSync=uid()}catch(e){window._pfSync=uid()}}
window.dskPick=async(kind,input)=>{const f=input&&input.files&&input.files[0];if(input)input.value='';if(!f)return;if(!uid())return toast('Hãy đăng nhập');if(!/^image\//.test(f.type)||f.size>8*1024*1024)return toast('Chọn ảnh JPG/PNG/WebP tối đa 8 MB');
toast('Đang xử lý ảnh…');let big,small;try{big=await shrink(f,kind==='cover'?1100:512,.82);small=await shrink(f,kind==='cover'?900:256,.76)}catch(e){return toast(e.message)}
let url='',via='';
try{const r=storageRef(storage,'profile/'+uid()+'/'+kind+'-'+Date.now()+'.jpg');await Promise.race([uploadBytes(r,big,{contentType:'image/jpeg'}),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),7000))]);url=await getDownloadURL(r);via='storage'}catch(e){url=''}
try{if(!url){url=await toData(small);via='db'}}catch(e){return toast(e.message)}
const key=kind==='cover'?'cover':'photo';
try{await setDoc(doc(db,'users',uid()),kind==='cover'?{cover:url}:{photo:url,photoURL:url},{merge:true});if(via==='storage'&&kind==='avatar'){try{await updateProfile(FU,{photoURL:url})}catch{}}}
catch(e){via='local';LSs('dsk_'+key+'_'+uid(),url)}
window.UP={...UPx(),[key]:url};if(kind==='avatar')syncProfile();
toast(via==='storage'?'Đã cập nhật ảnh':via==='db'?'Đã cập nhật ảnh':'Đã lưu ảnh trên thiết bị này (cơ sở dữ liệu từ chối ghi – xem hướng dẫn Rules)');R()};
window.changeAvatar=input=>dskPick('avatar',input);

/* ---------- hồ sơ & cài đặt ---------- */
const addrs=()=>UPx().addresses||LSg('dskAddrs_'+uid(),[]);
async function saveAddrs(list){LSs('dskAddrs_'+uid(),list);const d=list.find(x=>x.def);if(d){localStorage.setItem('dskA',d.addr);localStorage.setItem('dskP',d.phone)}try{await setDoc(doc(db,'users',uid()),{addresses:list},{merge:true})}catch(e){}window.UP={...UPx(),addresses:list}}
window.addrForm=id=>{const a=addrs().find(x=>x.id===id)||{};mdl(id?'Sửa địa chỉ':'Thêm địa chỉ',`<label>Người nhận</label><input id="ad-n" value="${esc(a.name||me().name)}"><label>Số điện thoại</label><input id="ad-p" inputmode="tel" value="${esc(a.phone||'')}"><label>Địa chỉ chi tiết</label><textarea id="ad-a" rows="3" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành">${esc(a.addr||'')}</textarea><label class="pay-choice"><input id="ad-d" type="checkbox" ${a.def?'checked':''}><span>Đặt làm địa chỉ mặc định</span></label>`,'Lưu địa chỉ',()=>addrSave(id||''))};
window.addrSave=async id=>{const n=mv('ad-n').trim(),p=mv('ad-p').trim(),a=mv('ad-a').trim(),d=!!($('#ad-d')||{}).checked;if(n.length<2||a.length<8)return toast('Nhập tên người nhận và địa chỉ đầy đủ');if(!/^(0|\+84)\d{8,10}$/.test(p.replace(/[\s.-]/g,'')))return toast('Số điện thoại không hợp lệ');
let l=addrs().map(x=>({...x}));const it={id:id||('a'+Date.now()),name:n,phone:p,addr:a,def:d};if(d)l.forEach(x=>x.def=false);const i=l.findIndex(x=>x.id===it.id);if(i>=0)l[i]=it;else l.push(it);if(!l.some(x=>x.def))l[0].def=true;await saveAddrs(l);mdx();toast('Đã lưu địa chỉ');R()};
window.addrDel=async id=>{if(!confirm('Xóa địa chỉ này?'))return;let l=addrs().filter(x=>x.id!==id);if(l.length&&!l.some(x=>x.def))l[0].def=true;await saveAddrs(l);R()};
window.addrDef=async id=>{await saveAddrs(addrs().map(x=>({...x,def:x.id===id})));toast('Đã đặt mặc định');R()};
window.pfSave=async()=>{const name=mv('pf-name').trim();if(name.length<2)return toast('Tên hiển thị tối thiểu 2 ký tự');const d={name,username:mv('pf-user').trim().replace(/^@/,'').slice(0,30),bio:mv('pf-bio').trim().slice(0,160),phone:mv('pf-phone').trim(),gender:mv('pf-gender'),birthday:mv('pf-bd')};if(d.phone&&!/^(0|\+84)\d{8,10}$/.test(d.phone.replace(/[\s.-]/g,'')))return toast('Số điện thoại không hợp lệ');
try{await updateProfile(auth.currentUser,{displayName:name});await setDoc(doc(db,'users',uid()),d,{merge:true});window.FU=auth.currentUser;window.UP={...UPx(),...d};await syncProfile();toast('Đã lưu hồ sơ');R()}catch(e){toast(err(e))}};
window.rename=()=>go('set');
let _pwa=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_pwa=e});
window.v3Install=async()=>{if(_pwa){_pwa.prompt();_pwa=null}else toast('Mở menu trình duyệt → "Thêm vào màn hình chính" để cài ứng dụng')};
window.v3Notif=async()=>{if(!('Notification' in window))return toast('Trình duyệt không hỗ trợ thông báo');const r=await Notification.requestPermission();toast(r==='granted'?'Đã bật thông báo tin nhắn mới':'Bạn chưa cho phép thông báo');R()};
const sw=(on,fn)=>`<span class="v3sw${on?' on':''}" onclick="${fn}"><i></i></span>`;
const brow=(i,t,s,right)=>`<div class="v3set"><span class="v3si">${i}</span><span class="g"><b>${t}</b>${s?`<small>${s}</small>`:''}</span>${right||''}</div>`;
PG.set=()=>{if(!me())return accv();const u=me(),p=UPx(),cv=myCover(),pr=PR(),bl=Object.keys(((CH.map)||{})).filter(k=>(CH.map[k].blocked||{})[uid()]);
const adl=addrs();
return PK(HD('Hồ sơ & cài đặt')+
`<div class="v3cover" style="${cv?`background-image:url('${esc(cv)}')`:''}"><label class="v3camc">📷 Đổi ảnh bìa<input type="file" accept="image/*" hidden onchange="dskPick('cover',this)"></label></div>
<div class="v3avrow"><div class="v3big">${av(myPhoto(),u.name,92)}<label class="v3cam">📷<input type="file" accept="image/*" hidden onchange="dskPick('avatar',this)"></label></div><div><b style="font-size:19px">${esc(u.name)}</b><div class="sub">${esc(u.email||u.phone||'')}</div></div></div>
<div class="c"><b class="v3h">👤 Thông tin cá nhân</b>
<label>Tên hiển thị</label><input id="pf-name" value="${esc(u.name)}" maxlength="40">
<label>Tên người dùng</label><input id="pf-user" value="${esc(p.username||'')}" placeholder="vd: diusoki.shop" maxlength="30">
<label>Giới thiệu bản thân <span class="sub">(tối đa 160 ký tự)</span></label><textarea id="pf-bio" rows="3" maxlength="160" placeholder="Viết vài dòng về bạn hoặc shop của bạn…">${esc(p.bio||'')}</textarea>
<label>Số điện thoại liên hệ</label><input id="pf-phone" inputmode="tel" value="${esc(p.phone||'')}" placeholder="Chỉ dùng cho giao hàng, không công khai">
<div class="row" style="gap:10px"><div class="g"><label>Giới tính</label><select id="pf-gender"><option value="">Không nêu</option>${['Nam','Nữ','Khác'].map(x=>`<option ${p.gender===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="g"><label>Ngày sinh</label><input id="pf-bd" type="date" value="${esc(p.birthday||'')}"></div></div>
<button class="btn w" style="margin-top:14px" onclick="pfSave()">💾 Lưu thay đổi</button></div>
<div class="c"><div class="row"><b class="v3h g">📍 Sổ địa chỉ</b><a class="chip2" style="margin:0" onclick="addrForm()">+ Thêm</a></div>${adl.map(a=>`<div class="v3addr"><div class="g"><b>${esc(a.name)}</b> · ${esc(a.phone)}${a.def?' <span class="v3tag">Mặc định</span>':''}<div class="sub">${esc(a.addr)}</div></div><div class="v3ac">${a.def?'':`<a onclick="addrDef('${a.id}')">Mặc định</a>`}<a onclick="addrForm('${a.id}')">Sửa</a><a onclick="addrDel('${a.id}')" style="color:#d9304f">Xóa</a></div></div>`).join('')||'<p class="sub">Chưa có địa chỉ. Thêm địa chỉ để tự điền khi thanh toán.</p>'}</div>
<div class="c"><b class="v3h">🎨 Giao diện</b>
${brow('🌙','Chế độ tối','Dịu mắt khi dùng buổi tối',sw(pr.dark,`v3Pref('dark',${!pr.dark})`))}
${brow('🔠','Cỡ chữ','',`<span class="v3seg">${[[.92,'A-'],[1,'A'],[1.1,'A+']].map(z=>`<a class="${(pr.zoom||1)===z[0]?'on':''}" onclick="v3Pref('zoom',${z[0]})">${z[1]}</a>`).join('')}</span>`)}
</div>

${brow('📲','Cài ứng dụng','Thêm diusoki vào màn hình chính',`<a class="chip2" style="margin:0" onclick="v3Install()">Cài đặt</a>`)}
${brow('🔔','Thông báo tin nhắn','Báo khi có tin mới lúc đang mở web',('Notification' in window&&Notification.permission==='granted')?'<span class="v3tag">Đang bật</span>':`<a class="chip2" style="margin:0" onclick="v3Notif()">Bật</a>`)}
</div>
<div class="c"><b class="v3h">🔒 Bảo mật</b>
${LR('🔑','Đổi mật khẩu (gửi liên kết qua email)',"resetMine()")}${LR('🛍️','Đăng ký người bán',"go('applySeller')")}${LR('📣','Đăng ký Affiliate',"go('applyAffiliate')")}
${bl.length?`<div class="sub" style="margin-top:8px">Người đã chặn:</div>${bl.map(k=>{const o=CH.map[k].members.find(m=>m!==uid());return `<div class="lr" style="cursor:default"><span class="g">${esc((CH.map[k].names||{})[o]||'Người dùng')}</span><a class="chip2" style="margin:0" onclick="chatBlockId('${k}')">Bỏ chặn</a></div>`}).join('')}`:''}
</div>
<div class="c">${LR('🚪','Đăng xuất',"out()",1)}</div>`)};

/* ---------- tin nhắn ---------- */
const CH={list:[],map:{},uid:null,unsub:null,first:true,err:'',msgs:[]};window._CH=CH;
const PF={};function pf(id){if(PF[id]!==undefined)return PF[id];PF[id]=null;try{getDoc(doc(db,'profiles',id)).then(s=>{PF[id]=s.exists()?s.data():{};if(V.p==='inbox')softR();if(V.p==='chat'){const e=document.getElementById('chat-av');if(e)e.innerHTML=av((PF[id]||{}).photo,V.toName,38)}}).catch(()=>{PF[id]={}})}catch{PF[id]={}}return PF[id]}
const softR=()=>{const a=document.activeElement;if(a&&/^(ib-q|chatText|pf-)/.test(a.id||''))return;R()};
const isUn=c=>c.lastFrom&&c.lastFrom!==uid()&&(c.lastAt||0)>((c.read||{})[uid()]||0);
const unreadN=()=>CH.list.filter(isUn).length;
function notify(c){const nm=(c.names||{})[c.lastFrom]||'Tin nhắn mới';toast('💬 '+nm+': '+(c.last||''));try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification(nm,{body:c.last||'',icon:''})}catch{}}
function updFab(){let b=document.getElementById('dskFab');if(!b){b=document.createElement('button');b.id='dskFab';b.setAttribute('aria-label','Tin nhắn');b.onclick=()=>go('inbox');document.body.appendChild(b)}const n=unreadN();b.innerHTML='💬'+(n?`<span class="badge">${n}</span>`:'');b.style.display=(uid()&&!['chat','inbox','post'].includes(V.p))?'flex':'none'}
function ensureChatSub(){const u=window.FU;if(!u){if(CH.unsub){CH.unsub();CH.unsub=null}CH.uid=null;CH.list=[];CH.map={};return}if(CH.uid===u.uid)return;CH.uid=u.uid;CH.first=true;CH.unsub&&CH.unsub();
CH.unsub=onSnapshot(query(collection(db,'chats'),where('members','array-contains',u.uid)),snap=>{const prev=CH.map||{};const list=snap.docs.map(d=>({id:d.id,...d.data()}));CH.err='';
list.forEach(c=>{const o=prev[c.id];if(!CH.first&&c.lastFrom&&c.lastFrom!==u.uid&&(!o||o.lastAt!==c.lastAt)&&!(V.p==='chat'&&V.chatId===c.id&&!document.hidden))notify(c)});
CH.map=Object.fromEntries(list.map(c=>[c.id,c]));CH.list=list.sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));CH.first=false;updFab();if(V.p==='inbox'||V.p==='noti')softR();if(V.p==='chat'&&window.chatRender)chatRender()},e=>{CH.err=e.code||e.message;updFab();if(V.p==='inbox')softR()})}

(S.orders||[]).filter(o=>o.buyer===S.me).forEach(o=>a.push({t:o.t,i:['🕒','🚚','✅','✖️'][o.status]||'📦',h:'Đơn #'+o.id+' · '+(ST[o.status]||''),s:'Tổng '+money(o.total),go:"go('orders')"}));
(typeof rup==='function'?rup():[]).forEach(o=>a.push({t:o.t,i:'🛍️',h:'Đơn bán #'+o.id,s:(ST[o.status]||'')+' · '+money(o.total),go:"go('sell')"}));

(S.topups||[]).filter(x=>x.uid===m).forEach(x=>a.push({t:x.t,i:'💳',h:'Nạp '+money(x.amount)+' · '+['Chờ duyệt','Đã cộng vào ví','Bị từ chối'][x.status],s:'',go:"go('wal')"}));

return PK(HD('Thông báo','🔔')+`<div class="c">${a.map(x=>`<div class="v3row" onclick="${x.go}"><span class="v3ni">${x.i}</span><div class="g" style="min-width:0"><b>${esc(x.h)}</b><div class="sub">${esc(x.s)}${x.s?' · ':''}${ago(x.t)}</div></div>${(x.t||0)>s?'<i class="v3dot"></i>':''}</div>`).join('')||'<p class="sub" style="text-align:center;padding:20px 0">Chưa có thông báo nào.</p>'}</div>`)};

/* ---------- điểm danh & hạng ---------- */
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const RANKS=[{n:'Đồng',min:0,c:'#b9774a',i:'🥉'},{n:'Bạc',min:2e6,c:'#8e9aaf',i:'🥈'},{n:'Vàng',min:5e6,c:'#e0a800',i:'🥇'},{n:'Kim cương',min:1e7,c:'#2aa5d8',i:'💎'}];
const spent=()=>(S.orders||[]).filter(o=>o.buyer===S.me&&o.status===2).reduce((a,o)=>a+(o.total||0),0);
window.rwCheckin=async()=>{const p=UPx(),td=ymd(Date.now());if(p.lastCheckin===td)return toast('Hôm nay bạn đã điểm danh rồi');const streak=p.lastCheckin===ymd(Date.now()-864e5)?(p.streak||0)+1:1,gain=10+Math.min(streak-1,6)*5,d={points:(p.points||0)+gain,streak,lastCheckin:td,checkins:[...(p.checkins||[]),td].slice(-30)};
try{await setDoc(doc(db,'users',uid()),d,{merge:true});window.UP={...p,...d};toast('🎁 Điểm danh +'+gain+' điểm · chuỗi '+streak+' ngày');R()}catch(e){toast(err(e))}};
PG.rw=()=>{if(!me())return accv();const p=UPx(),sp=spent(),ri=RANKS.reduce((r,x,i)=>sp>=x.min?i:r,0),rk=RANKS[ri],nx=RANKS[ri+1],pct=nx?Math.min(100,Math.round((sp-rk.min)*100/(nx.min-rk.min))):100,done=p.lastCheckin===ymd(Date.now()),st=p.lastCheckin===ymd(Date.now())||p.lastCheckin===ymd(Date.now()-864e5)?(p.streak||0):0;
const days=[...Array(7)].map((_,i)=>{const on=i<st%7||(st>0&&st%7===0);return `<div class="v3day7${on?' on':''}"><b>${i+1}</b><small>+${10+i*5}</small></div>`}).join('');
return PK(HD('Điểm danh & hạng thành viên')+`<div class="c v3rank" style="background:linear-gradient(135deg,${rk.c},${rk.c}cc)"><div style="font-size:44px">${rk.i}</div><div class="g"><small>Hạng thành viên</small><b style="font-size:24px;display:block">${rk.n}</b></div><div style="text-align:right"><small>Điểm của bạn</small><b style="font-size:24px;display:block">${p.points||0}</b></div></div>
<div class="c"><b class="v3h">Tiến độ lên hạng</b><div class="v3bar"><i style="width:${pct}%"></i></div><div class="sub">${nx?`Đã chi ${money(sp)} · cần thêm ${money(nx.min-sp)} để lên hạng ${nx.n}`:`Bạn đang ở hạng cao nhất · tổng chi ${money(sp)}`}</div><div class="sub" style="margin-top:4px">Tính trên các đơn hàng đã hoàn thành.</div></div>
<div class="c"><b class="v3h">🎁 Điểm danh mỗi ngày</b><div class="v3d7">${days}</div><button class="btn w" ${done?'disabled style="opacity:.6"':''} onclick="rwCheckin()">${done?'✓ Hôm nay đã điểm danh':'Điểm danh nhận điểm'}</button><p class="sub" style="margin-top:8px">Chuỗi hiện tại: <b>${st}</b> ngày. Điểm tích lũy dùng cho các ưu đãi sẽ ra mắt sau.</p></div>`)};

/* ---------- voucher, mời bạn, đã xem ---------- */
window.vcCopy=c=>{try{navigator.clipboard.writeText(c)}catch{}toast('Đã sao chép mã '+c)};
window.vcUse=c=>{VC=c;toast('Đã chọn mã '+c+' – áp dụng ở bước thanh toán');go('cart')};
PG.myvc=()=>PK(HD('Kho voucher')+Object.entries(VCS).map(([c,d])=>`<div class="c v3vc"><div class="v3vl">🎟️</div><div class="g"><b>${c}</b><div class="sub">${d}</div></div><div style="display:grid;gap:6px"><a class="chip2" style="margin:0" onclick="vcCopy('${c}')">Sao chép</a><a class="pbtn" style="padding:6px 14px;font-size:12px" onclick="vcUse('${c}')">Dùng ngay</a></div></div>`).join(''));
const invLink=()=>location.origin.startsWith('http')?location.origin+location.pathname+((UPx().affiliateStatus==='approved')?'?ref='+uid():''):location.href.split('?')[0];
window.invShare=async()=>{const l=invLink();try{if(navigator.share)return await navigator.share({title:'diusoki',text:'Mua sắm cùng diusoki nhé!',url:l})}catch{return}try{await navigator.clipboard.writeText(l)}catch{}toast('Đã sao chép liên kết')};
PG.inv=()=>PK(HD('Mời bạn bè')+`<div class="c" style="text-align:center"><div style="font-size:54px">📨</div><b style="font-size:18px">Chia sẻ diusoki</b><p class="sub">Gửi liên kết cho bạn bè, người thân cùng mua sắm.${UPx().affiliateStatus==='approved'?' Liên kết đã gắn mã affiliate của bạn.':''}</p><input readonly value="${esc(invLink())}" onclick="this.select()"><button class="btn w" onclick="invShare()">Chia sẻ liên kết</button></div>`);
PG.recent=()=>{const a=LS('dskRec',[]).map(i=>S.products.find(p=>p.id===i)).filter(Boolean);return PK(HD('Đã xem gần đây')+`<div class="c">${a.map(p=>`<div class="v3row" onclick="go('prod',{id:'${p.id}'})">${p.img?`<img class="thumb" style="width:56px;height:56px;border-radius:12px;object-fit:cover" src="${p.img}" alt="">`:'<span class="v3ni">🛍️</span>'}<div class="g" style="min-width:0"><b>${esc(p.name)}</b><div class="pr">${money(p.price)}</div></div></div>`).join('')||'<p class="sub" style="text-align:center;padding:18px 0">Bạn chưa xem sản phẩm nào.</p>'}</div>`)};
['inbox','chat','noti','rw','myvc','inv','recent','wdh','set'].forEach(k=>ACCP.add(k));

/* ---------- trang Tài khoản: ảnh bìa + lối tắt ---------- */
const _acc=PG.acc;PG.acc=()=>{let h=_acc();if(!me())return h;ensureChatSub();const cv=myCover(),un=unreadN(),nn=notiN();
if(cv)h=h.replace('<div class="top2">',`<div class="top2 v3hasc" style="background-image:linear-gradient(180deg,#0000 30%,#0008),url('${esc(cv)}')">`);
h=h.replace(/<a onclick="[^"]*">💬<\/a>/,`<a onclick="go('inbox')" style="position:relative">💬${un?`<span class="badge" style="top:-6px;right:-8px">${un}</span>`:''}</a>`);
const tile=(i,l,f,b)=>`<div class="v3tile" onclick="${f}"><span>${i}</span><small>${l}</small>${b?`<i class="badge">${b}</i>`:''}</div>`;
const card=`<div class="c"><b style="font-size:16px">✨ Tiện ích của tôi</b><div class="v3grid">${tile('👤','Hồ sơ',"go('set')")}${tile('💬','Tin nhắn',"go('inbox')",un)}${tile('🔔','Thông báo',"go('noti')",nn)}${tile('🎁','Điểm danh',"go('rw')")}${tile('🎟️','Voucher',"go('myvc')")}${tile('👛','Ví & rút tiền',"go('wal')")}${tile('🧾','Lịch sử rút',"go('wdh')")}${tile('📨','Mời bạn bè',"go('inv')")}${tile('🕘','Đã xem',"go('recent')")}${tile('📍','Địa chỉ',"go('set')")}</div></div>`;
const k='<div class="c"><b style="font-size:16px">Ví & hậu mãi</b>';return h.includes(k)?h.replace(k,()=>card+k):h+card};

/* ---------- hậu xử lý mỗi lần vẽ ---------- */
const _R=window.R;window.R=function(){const r=_R.apply(this,arguments);try{post()}catch(e){console.warn(e)}return r};
function post(){document.body.classList.toggle('inchat',V.p==='chat');if(V.p!=='chat'&&window._chatUnsub){try{window._chatUnsub()}catch{}window._chatUnsub=null;_mu=null}
if(window.FU&&!UPx().photo&&LSg('dsk_photo_'+uid(),''))window.UP={...UPx(),photo:LSg('dsk_photo_'+uid(),'')};if(window.FU&&!UPx().cover&&LSg('dsk_cover_'+uid(),''))window.UP={...UPx(),cover:LSg('dsk_cover_'+uid(),'')};
updFab();let t=document.getElementById('dskTop');if(!t){t=document.createElement('button');t.id='dskTop';t.textContent='↑';t.setAttribute('aria-label','Lên đầu trang');t.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(t)}}
addEventListener('scroll',()=>{const t=document.getElementById('dskTop');if(t)t.classList.toggle('show',scrollY>700)},{passive:true});
addEventListener('click',e=>{const i=e.target;if(V.p==='prod'&&i&&i.tagName==='IMG'&&i.width>150&&!i.closest('#dskLb')&&!i.closest('.nav')){const o=document.createElement('div');o.id='dskLb';o.innerHTML=`<img src="${i.src}" alt=""><span>✕</span>`;o.onclick=()=>o.remove();document.body.appendChild(o)}});
setInterval(()=>{ensureChatSub();if(window.FU&&window._pfSync!==uid()&&me())syncProfile();updFab()},1500);
applyPrefs();document.addEventListener('DOMContentLoaded',applyPrefs);
})();

<script>
/* ===== DIUSOKI v4: ẩn hàng hết, khám phá shop, mã giảm giá tạo/xóa, tải ứng dụng ===== */
(()=>{
'use strict';
const UPx=()=>window.UP||{},uid=()=>window.FU&&FU.uid;
const fold=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const soldOut=p=>!p.unl&&(+p.stock||0)<1;
const withStock=(fn)=>{const real=S.products;S.products=real.filter(p=>!soldOut(p));try{return fn()}finally{S.products=real}};

/* ---------- 1. Hàng hết thì ẩn khỏi giao diện chính, hạ xuống cuối trang shop ---------- */
const _filtered=window.filtered;window.filtered=function(){return _filtered.apply(this,arguments).filter(p=>!soldOut(p))};
const _catv=window.catv;window.catv=function(){return withStock(()=>_catv.apply(this,arguments))};
const _home=window.home;window.home=function(){const h=withStock(()=>_home.apply(this,arguments));
const b=`<div class="v4ban"><a onclick="go('shops')"><span>🏪</span><b>Khám phá shop</b><small>Tìm cửa hàng</small></a><a onclick="go('app')"><span>📲</span><b>Tải ứng dụng</b><small>Cài lên điện thoại</small></a><a onclick="need(()=>go('myvc'))"><span>🎟️</span><b>Mã giảm giá</b><small>Săn ưu đãi</small></a></div>`;
return h.includes('<div class="trust">')?h.replace('<div class="trust">',()=>b+'<div class="trust">'):h+b};
const _shop=window.shop;window.shop=function(){const real=S.products,id=V.id,name=((real.find(p=>p.seller===id)||{}).sellerName)||'Cửa hàng';let h;
S.products=real.filter(p=>!soldOut(p));try{h=_shop.apply(this,arguments)}finally{S.products=real}
h=h.replace('🏪 Cửa hàng','🏪 '+esc(name));const out=real.filter(p=>p.seller===id&&soldOut(p));
if(out.length)h+=`<div class="pg"><details class="v4so"><summary>📦 Sản phẩm đã hết hàng (${out.length})</summary>${out.map(p=>`<div class="v4sor" onclick="go('prod',{id:'${p.id}'})">${p.img?`<img src="${p.img}" alt="">`:'<span class="v3ni">🛍️</span>'}<div class="g"><b>${esc(p.name)}</b><div class="sub">Hết hàng · chờ shop nhập thêm</div></div></div>`).join('')}</details></div>`;return h};

/* ---------- 2. Khám phá shop (tìm kiếm shop như Shopee) ---------- */
const shopsAll=()=>{const m=new Map();S.products.forEach(p=>{if(!p.seller)return;let s=m.get(p.seller);if(!s){s={id:p.seller,name:p.sellerName||'Shop',n:0,cats:new Set(),items:[],names:''};m.set(p.seller,s)}if(!soldOut(p)){s.n++;if(s.items.length<3&&p.img)s.items.push(p.img);s.cats.add(p.cat);s.names+=' '+p.name}});return [...m.values()].filter(s=>s.n>0)};
const shopCards=q=>{const n=fold(q).trim();let a=shopsAll();if(n)a=a.filter(s=>fold(s.name+' '+[...s.cats].join(' ')+' '+s.names).includes(n));a.sort((x,y)=>y.n-x.n);
return a.map(s=>`<div class="c v4shop"><div class="row" style="gap:12px"><span class="v3av" style="width:52px;height:52px;font-size:22px">${esc((s.name.trim()[0]||'S').toUpperCase())}</span><div class="g" style="min-width:0"><b style="font-size:16px">${esc(s.name)}</b><div class="sub">${s.n} sản phẩm đang bán${s.cats.size?' · '+esc([...s.cats].slice(0,2).join(', ')):''}</div></div></div>${s.items.length?`<div class="v4th">${s.items.map(i=>`<img src="${i}" alt="">`).join('')}</div>`:''}<div class="row" style="gap:8px;margin-top:10px"><a class="btn s g" onclick="go('shop',{id:'${s.id}'})">Xem shop</a><a class="btn o s g" data-to="${esc(s.id)}" data-name="${esc(s.name)}" onclick="need(()=>openChat(this))">💬 Nhắn tin</a><a class="btn o s" onclick="need(()=>followShop('${s.id}'))">♡</a></div></div>`).join('')||`<div class="c" style="text-align:center;color:#8c88a0"><div style="font-size:40px">🔎</div>Không tìm thấy shop nào${q?` cho “${esc(q)}”`:''}.<br>Hãy thử từ khóa khác.</div>`};
let _sq='',_st;window.shopQ=v=>{_sq=v;clearTimeout(_st);_st=setTimeout(()=>{const b=document.getElementById('shop-list');if(b)b.innerHTML=shopCards(v)},200)};
PG.shops=()=>PK(HD('Khám phá shop','🏪',"go('home')")+`<div class="c" style="padding:10px 12px"><input id="shop-q" type="search" value="${esc(_sq)}" placeholder="🔍 Tìm shop theo tên, ngành hàng, sản phẩm…" oninput="shopQ(this.value)" style="margin:0" autocomplete="off"></div><div id="shop-list">${shopCards(_sq)}</div>`);

/* ---------- 3. Mã giảm giá: tạo / tắt / xóa (lưu Firestore) ---------- */
S.vouchers=S.vouchers||[];let _vs=false;
const findV=c=>{c=String(c||'').trim().toUpperCase();return c?(S.vouchers||[]).find(v=>v.id===c):null};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const vState=v=>!v.active?'Đã tắt':(v.exp&&v.exp<today())?'Hết hạn':(v.qty&&(v.used||0)>=v.qty)?'Hết lượt':'Đang hoạt động';
const vDesc=v=>(v.type==='pct'?`Giảm ${v.value}%${v.max?` (tối đa ${money(v.max)})`:''}`:v.type==='amt'?`Giảm ${money(v.value)}`:'Miễn phí vận chuyển')+(v.min?` · đơn từ ${money(v.min)}`:'')+(v.seller?' · Chỉ cho sản phẩm của shop':' · Toàn sàn')+(v.exp?' · HSD '+v.exp.split('-').reverse().join('/'):'');
const cartSub=sel=>S.cart.reduce((a,c)=>{const p=S.products.find(x=>x.id===c.id);return p&&(!sel||p.seller===sel)?a+p.price*Math.min(c.q,p.unl?c.q:(p.stock||0)):a},0);
const vCheck=(v,t)=>{if(vState(v)!=='Đang hoạt động')return 'Mã '+v.id+' '+vState(v).toLowerCase();if(v.min&&t<v.min)return 'Đơn tối thiểu '+money(v.min)+' để dùng mã này';if(v.seller&&cartSub(v.seller)<=0)return 'Mã chỉ áp dụng cho sản phẩm của shop phát hành';return true};
const _calc=window.calc;window.calc=function(t){const c=findV(VC);if(!c)return _calc.apply(this,arguments);let ship=t&&t<300000?20000:0,d=0;if(vCheck(c,t)===true){const el=c.seller?cartSub(c.seller):t;if(c.type==='ship')ship=0;else if(c.type==='pct')d=Math.min(c.max||1e12,Math.round(el*c.value/100));else d=Math.min(c.value,el)}return{ship,d,total:Math.max(0,t+ship-d)}};
window.applyVc=function(){const v=($('#vc').value||'').trim().toUpperCase(),f={a:$('#cn').value,b:$('#cp').value,c:$('#ca').value,d:$('#cm').selectedIndex},c=findV(v);if(v&&!VCS[v]&&!c)return toast('Mã không hợp lệ');if(c){const r=vCheck(c,cartSub());if(r!==true)return toast(r)}VC=v;if(v)toast('Đã áp dụng: '+(VCS[v]||vDesc(c)));R();$('#cn').value=f.a;$('#cp').value=f.b;$('#ca').value=f.c;$('#cm').selectedIndex=f.d};
const _ord=window.order;window.order=async function(){const c=findV(VC);const r=await _ord.apply(this,arguments);if(c&&!S.cart.length){try{await updateDoc(doc(db,'vouchers',c.id),{used:increment(1)})}catch(e){}}return r};
function vSub(){if(_vs||!window.db||!window.FU)return;_vs=true;try{onSnapshot(collection(db,'vouchers'),sn=>{S.vouchers=sn.docs.map(d=>({id:d.id,...d.data()}));if(['vch','myvc','vmg'].includes(V.p))R()},()=>{})}catch(e){_vs=false}}
setInterval(vSub,1500);
const canMake=()=>isAdmin()||mine().length>0||UPx().sellerStatus==='approved';
const mineV=()=>(S.vouchers||[]).filter(v=>isAdmin()||v.seller===uid());
window.vForm=()=>{if(!canMake())return toast('Chỉ admin hoặc người bán mới tạo được mã giảm giá');mdl('Tạo mã giảm giá',`<label>Mã (chữ HOA/số, 3–20 ký tự)</label><input id="vf-c" maxlength="20" placeholder="VD: SALE20" style="text-transform:uppercase">
<label>Loại giảm</label><select id="vf-t" onchange="document.getElementById('vf-vw').style.display=this.value==='ship'?'none':'block';document.getElementById('vf-mw').style.display=this.value==='pct'?'block':'none'"><option value="pct">Giảm theo %</option><option value="amt">Giảm số tiền (₫)</option><option value="ship">Miễn phí vận chuyển</option></select>
<div id="vf-vw"><label>Giá trị (% hoặc ₫)</label><input id="vf-v" type="number" inputmode="numeric" placeholder="VD: 10 hoặc 20000"></div><div id="vf-mw"><label>Giảm tối đa (₫, để trống nếu không giới hạn)</label><input id="vf-m" type="number" inputmode="numeric"></div>
<label>Đơn tối thiểu (₫)</label><input id="vf-n" type="number" inputmode="numeric" placeholder="0"><label>Số lượt dùng tối đa</label><input id="vf-q" type="number" inputmode="numeric" placeholder="VD: 100"><label>Hạn sử dụng (không bắt buộc)</label><input id="vf-e" type="date">
<p class="pay-note">${isAdmin()?'Mã do admin tạo áp dụng cho toàn sàn.':'Mã của shop chỉ giảm trên sản phẩm của shop bạn.'}</p>`,'Tạo mã',()=>vSave())};
window.vSave=async()=>{const code=mv('vf-c').trim().toUpperCase(),type=mv('vf-t'),val=Math.floor(+mv('vf-v')),max=Math.floor(+mv('vf-m'))||0,min=Math.floor(+mv('vf-n'))||0,qty=Math.floor(+mv('vf-q')),exp=mv('vf-e');
if(!/^[A-Z0-9]{3,20}$/.test(code))return toast('Mã gồm chữ HOA/số, 3–20 ký tự');if(VCS[code])return toast('Mã này trùng mã hệ thống');if(type==='pct'&&!(val>=1&&val<=100))return toast('Phần trăm từ 1 đến 100');if(type==='amt'&&!(val>=1000))return toast('Số tiền giảm tối thiểu 1.000₫');if(!(qty>=1))return toast('Nhập số lượt dùng (≥ 1)');if(exp&&exp<today())return toast('Hạn sử dụng phải từ hôm nay');
try{const ref=doc(db,'vouchers',code),ex=await getDoc(ref);if(ex.exists())return toast('Mã '+code+' đã tồn tại, hãy chọn mã khác');await setDoc(ref,{code,type,value:type==='ship'?0:val,max:type==='pct'?max:0,min,qty,used:0,exp:exp||'',seller:isAdmin()?'':uid(),sellerName:isAdmin()?'':me().name,active:true,t:Date.now()});mdx();toast('Đã tạo mã '+code);R()}catch(e){toast(err(e))}};
window.vToggle=async id=>{const v=findV(id);if(!v)return;try{await updateDoc(doc(db,'vouchers',id),{active:!v.active});toast(v.active?'Đã tắt mã '+id:'Đã bật mã '+id)}catch(e){toast(err(e))}};
window.vDel=async id=>{if(!confirm('Xóa mã '+id+'? Hành động này không hoàn tác.'))return;try{await deleteDoc(doc(db,'vouchers',id));toast('Đã xóa mã '+id)}catch(e){toast(err(e))}};
const vCard=(v,mg)=>`<div class="c v3vc ${vState(v)==='Đang hoạt động'?'':'v4off'}"><div class="v3vl">🎟️</div><div class="g" style="min-width:0"><b>${esc(v.id)}</b> <span class="v3tag" style="${vState(v)==='Đang hoạt động'?'background:#e1f7ec;color:#1a9d63':''}">${vState(v)}</span><div class="sub">${esc(vDesc(v))}</div>${mg?`<div class="sub">Đã dùng ${v.used||0}/${v.qty}${isAdmin()&&v.seller?' · Shop: '+esc(v.sellerName||''):''}</div>`:''}</div>${mg?`<div style="display:grid;gap:6px"><a class="chip2" style="margin:0" onclick="vToggle('${v.id}')">${v.active?'Tắt':'Bật'}</a><a class="chip2" style="margin:0;color:#d9304f" onclick="vDel('${v.id}')">🗑 Xóa</a></div>`:`<div style="display:grid;gap:6px"><a class="chip2" style="margin:0" onclick="vcCopy('${v.id}')">Sao chép</a>${vState(v)==='Đang hoạt động'?`<a class="pbtn" style="padding:6px 14px;font-size:12px" onclick="vcUse('${v.id}')">Dùng ngay</a>`:''}</div>`}</div>`;
const builtin=()=>Object.entries(VCS).map(([c,d])=>vCard({id:c,type:'x',active:true,qty:0,seller:'',exp:''},false).replace(/<div class="sub">[^<]*<\/div>/,`<div class="sub">${d} · Toàn sàn</div>`));
const pubV=()=>(S.vouchers||[]).filter(v=>vState(v)==='Đang hoạt động');
const vlist=()=>builtin().join('')+pubV().map(v=>vCard(v,false)).join('');
PG.vch=()=>PK(HD('Mã giảm giá','',"go('sell')")+`${canMake()?`<div class="c"><div class="row"><b class="g" style="font-size:16px">🛠 Mã tôi đã tạo</b><a class="btn s" onclick="vForm()">+ Tạo mã</a></div>${mineV().map(v=>vCard(v,true).replace('class="c v3vc','class="v3vc').replace(/margin:/,'margin:')).join('')||'<p class="sub" style="margin-top:8px">Chưa có mã nào. Nhấn “Tạo mã” để tạo mã giảm giá cho khách.</p>'}</div>`:''}<div class="sub" style="padding:4px 20px">Mã đang áp dụng</div>${vlist()}`);
PG.myvc=()=>PK(HD('Kho voucher')+vlist()+(canMake()?`<div style="padding:0 12px"><a class="btn o w" onclick="go('vch')">🛠 Tạo / quản lý mã giảm giá</a></div>`:''));
window.vcCopy=window.vcCopy||(c=>{try{navigator.clipboard.writeText(c)}catch{}toast('Đã sao chép mã '+c)});
window.vcUse=window.vcUse||(c=>{VC=c;toast('Đã chọn mã '+c+' – áp dụng ở bước thanh toán');go('cart')});

/* ---------- 4. Tải ứng dụng: PWA + APK ---------- */
let _pwa=window.__pwaEv||null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_pwa=e});
window.appInstall=async()=>{if(_pwa){_pwa.prompt();_pwa=null}else toast('Mở menu trình duyệt (⋮) → “Thêm vào màn hình chính” để cài ứng dụng')};
window.apkSave=()=>{const u=mv('apk-u').trim(),v=mv('apk-v').trim(),n=mv('apk-n').trim();if(u&&!/^https:\/\//.test(u))return toast('Liên kết APK phải bắt đầu bằng https://');if(u&&!/\.apk(\?|$)/i.test(u)&&!confirm('Liên kết không kết thúc bằng .apk. Vẫn lưu?'))return;cfSave({apkUrl:u,apkVersion:v,apkNote:n})};
PG.app=()=>{const c=S.cfg||{},has=!!c.apkUrl,standalone=matchMedia('(display-mode: standalone)').matches;
return PK(HD('Tải ứng dụng diusoki','📲',"go('home')")+`<div class="c" style="text-align:center"><div style="font-size:54px">📱</div><b style="font-size:19px">Mua sắm nhanh hơn trên điện thoại</b><p class="sub">Mở như ứng dụng thật, toàn màn hình, nhận thông báo tin nhắn.</p></div>
<div class="c"><b class="v3h">⚡ Cách 1: Cài ngay (PWA) · khuyên dùng</b><p class="sub">Không cần tải file, luôn là bản mới nhất, dùng được trên Android và iPhone.</p>${standalone?'<div class="hint">✅ Bạn đang dùng ứng dụng đã cài.</div>':`<button class="btn w" onclick="appInstall()">📲 Cài ứng dụng lên màn hình chính</button>`}<p class="sub" style="margin-top:8px">Nếu không hiện hộp thoại: Android Chrome → menu ⋮ → “Cài đặt ứng dụng”; iPhone Safari → nút Chia sẻ → “Thêm vào MH chính”.</p></div>
<div class="c"><b class="v3h">🤖 Cách 2: Tải file APK (Android)</b>${has?`<div class="row" style="margin:6px 0"><span class="v3tag">Phiên bản ${esc(c.apkVersion||'—')}</span></div>${c.apkNote?`<p class="sub">${esc(c.apkNote)}</p>`:''}<a class="btn w" href="${esc(c.apkUrl)}" download rel="noopener">⬇ Tải APK${c.apkVersion?' v'+esc(c.apkVersion):''}</a><div class="hint" style="margin-top:10px">Cách cài an toàn: mở file vừa tải → nếu máy hỏi, bật “Cho phép cài từ nguồn này” → bấm Cài đặt. Chỉ tải APK từ trang chính thức này.</div>`:`<div class="hint" style="background:#fff3e0;color:#b25e00">Bản APK chưa được phát hành. Hiện bạn hãy dùng Cách 1 để có trải nghiệm tương tự.</div>`}</div>
${isAdmin()?`<div class="c"><b class="v3h">🛡 Admin: đăng liên kết APK</b><p class="sub">Build APK (xem file HUONG-DAN-BUILD-APK.txt), tải lên hosting/GitHub Releases rồi dán liên kết https vào đây. Nút tải chỉ hiện khi có liên kết thật.</p><label>Liên kết file .apk</label><input id="apk-u" value="${esc(c.apkUrl||'')}" placeholder="https://…/diusoki.apk"><label>Phiên bản</label><input id="apk-v" value="${esc(c.apkVersion||'')}" placeholder="1.0.0"><label>Ghi chú cập nhật</label><textarea id="apk-n" rows="2">${esc(c.apkNote||'')}</textarea><button class="btn w" style="margin-top:10px" onclick="apkSave()">Lưu</button></div>`:''}`)};

/* ---------- lối tắt trong Tài khoản ---------- */
const _acc=PG.acc;PG.acc=()=>{let h=_acc();if(!me())return h;const t=(i,l,f)=>`<div class="v3tile" onclick="${f}"><span>${i}</span><small>${l}</small></div>`;
const card=`<div class="c"><b style="font-size:16px">🛒 Mua sắm & ứng dụng</b><div class="v3grid">${t('🏪','Khám phá shop',"go('shops')")}${t('📲','Tải ứng dụng',"go('app')")}${t('🎟️','Kho voucher',"go('myvc')")}${canMake()?t('🛠','Tạo/xóa mã',"go('vch')"):''}</div></div>`;const k='<div class="c"><b style="font-size:16px">✨ Tiện ích của tôi</b>';return h.includes(k)?h.replace(k,()=>card+k):h+card};
['shops','app','vch','myvc'].forEach(k=>ACCP.add(k));
})();

</script>
</body></html>
